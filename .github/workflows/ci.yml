name: CI

# Phase 1 exit criterion: a migration can ship through CI without manual steps.
# Every job here must pass before anything reaches staging.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  api:
    name: API (lint, migrations, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mip
          POSTGRES_PASSWORD: mip
          POSTGRES_DB: mip
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mip -d mip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://mip:mip@localhost:5433/mip
      REDIS_URL: redis://localhost:6380/0
      ENVIRONMENT: test
      AUTH_PROVIDER: local
      JWT_SECRET: ci-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]" -e "./apps/worker[dev]"

      - name: Lint
        run: |
          ruff check apps/api/app apps/api/tests apps/worker/worker apps/worker/tests
          ruff format --check apps/api/app apps/worker/worker

      - name: Typecheck
        run: mypy apps/api/app

      - name: Migrations apply cleanly from scratch
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Seed reference data
        working-directory: apps/api
        run: python -m app.db.seed

      # The suite itself runs `alembic check`, which fails if a model changed
      # without a matching revision. That is the guard against schema drift.
      - name: API tests
        working-directory: apps/api
        run: pytest -q

      - name: Worker tests
        working-directory: apps/worker
        env:
          DATABASE_URL: postgresql+psycopg://mip:mip@localhost:5433/mip_test
        run: pytest -q

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # apps/web is an npm workspace: one lockfile at the repo root, installed
      # from the root. Do not add a second lockfile inside apps/web.
      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint:web

      - name: Typecheck
        run: npm run typecheck:web

      - name: Unit tests
        run: npm run test:web

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build:web

  deploy-staging:
    name: Deploy to staging
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Wire this to Railway/Fly (api, worker) and Vercel (web)."
          echo "The deploy must run 'alembic upgrade head' and 'python -m app.db.seed'"
          echo "before the new API revision takes traffic."
